<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nico-agent</title>
<!-- The Ready mark, ink on the browser's own light or dark tab bar; inline, so the page asks serve for no favicon. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cstyle%3Ecircle%7Bstroke:%23111214%7D@media(prefers-color-scheme:dark)%7Bcircle%7Bstroke:%23eef1f4%7D%7D%3C/style%3E%3Ccircle cx='8' cy='8' r='5.5' fill='none' stroke-width='3'/%3E%3C/svg%3E">
<script>
  // The remembered theme (src/ThemeSwitch.svelte), set before the first paint so the page never flashes the wrong one.
  try {
    var choice = localStorage.getItem("nico-agent.theme");
  } catch (e) {}
  var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
