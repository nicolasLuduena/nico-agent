name: CI

# Every pull request, so stacked PRs onto a spec branch are checked as well as those onto loop.
on:
  pull_request:
  push:
    branches: [loop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
