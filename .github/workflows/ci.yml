name: CI

# Every pull request, so stacked PRs onto a spec branch are checked as well as those onto loop.
on:
  pull_request:
  push:
    branches: [loop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # build.rs builds the app in web/ with Vite.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Vitest
        working-directory: web
        run: npm ci && npm test
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
