<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nico-agent</title>
<script>
  // The remembered theme (src/app/theme.ts), set before the first paint so the page never flashes the wrong one.
  try {
    var choice = localStorage.getItem("nico-agent.theme");
    if (choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark";
    else document.documentElement.dataset.theme = "light";
  } catch (e) {
    document.documentElement.dataset.theme = "light";
  }
</script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
